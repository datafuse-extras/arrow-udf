[package]
name = "arrow-udf-duckdb-example"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
arrow-udf = { path = "../arrow-udf" }
# duckdb must use the same arrow major version as arrow-udf (58): 1.10506 is
# the last release line on arrow 58, 1.20000 moved to arrow 60.
duckdb = { version = "~1.10506", features = ["vscalar", "vscalar-arrow", "vtab-arrow", "vtab-loadable"] }
duckdb-loadable-macros = { version = "0.1" }
libduckdb-sys = { version = "~1.10506", features = ["loadable-extension"] }
